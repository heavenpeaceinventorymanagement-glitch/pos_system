<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Peace POS</title>
    <!-- Tailwind CSS for Beautiful Modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold tracking-wide">🕊️ Heaven Peace POS</h1>
        <div id="live-time" class="text-sm font-semibold hidden md:block"></div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Section: Product Entry -->
        <section class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">ഉൽപ്പന്നങ്ങൾ ചേർക്കുക (Add Items)</h2>
            
            <form id="item-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Item Name / Barcode</label>
                    <input type="text" id="item-name" placeholder="ഉൽപ്പന്നത്തിന്റെ പേര്" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Price (₹)</label>
                    <input type="number" id="item-price" placeholder="വില" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required min="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Quantity</label>
                    <input type="number" id="item-qty" value="1" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required min="1">
                </div>
                <div class="md:col-span-3">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-xl transition duration-200 shadow-md">
                        + Add to Bill
                    </button>
                </div>
            </form>

            <!-- Cart Table -->
            <div class="mt-8 overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm font-semibold">
                            <th class="p-3">Item</th>
                            <th class="p-3 text-center">Price</th>
                            <th class="p-3 text-center">Qty</th>
                            <th class="p-3 text-right">Total</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-table-body" class="text-gray-700 divide-y divide-gray-100">
                        <!-- Items will be added here dynamically -->
                    </tbody>
                </table>
                <div id="empty-cart-msg" class="text-center py-8 text-gray-400">കാർട്ടിൽ ഉൽപ്പന്നങ്ങൾ ഒന്നും തന്നെയില്ല!</div>
            </div>
        </section>

        <!-- Right Section: Checkout & Summary -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">ബിൽ സംഗ്രഹം (Summary)</h2>
                
                <div class="space-y-4 my-6">
                    <div class="flex justify-between text-gray-600">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0.00</span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>GST (18%):</span>
                        <span id="tax">₹0.00</span>
                    </div>
                    <div class="flex justify-between text-xl font-bold text-gray-800 pt-2 border-t border-dashed">
                        <span>Grand Total:</span>
                        <span id="grand-total" class="text-blue-600">₹0.00</span>
                    </div>
                </div>

                <!-- Customer Details -->
                <div class="space-y-3 mb-6">
                    <input type="text" id="customer-phone" placeholder="കസ്റ്റമർ ഫോൺ നമ്പർ (ഓപ്ഷണൽ)" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-1 focus:ring-blue-500">
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="checkoutBill()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2">
                    💾 Save & Print Bill
                </button>
                <button onclick="clearCart()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium p-2 rounded-xl text-sm transition">
                    Clear All
                </button>
            </div>
        </section>
    </main>

    <!-- Firebase SDK Integration with Your Provided Config -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // നിങ്ങളുടെ ഒറിജിനൽ ഫയർബേസ് കോൺഫിഗറേഷൻ
        const firebaseConfig = {
            apiKey: "AIzaSyCZQrqEz8UElnroPDqIEGEUc7YL0qZzi7A",
            authDomain: "heaven-peace-pos.firebaseapp.com",
            databaseURL: "https://heaven-peace-pos-default-rtdb.firebaseio.com", // സാധാരണയായി ഇതാണ് വരിക, മാറ്റിയിട്ടുണ്ടെങ്കിൽ അതനുസരിച്ച് കൊടുക്കാം
            projectId: "heaven-peace-pos",
            storageBucket: "heaven-peace-pos.firebasestorage.app",
            messagingSenderId: "959112672379",
            appId: "1:959112672379:web:8e91b2b2afcaf150385ede",
            measurementId: "G-8R5X4NH6RJ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const analytics = getAnalytics(app);

        // JavaScript-ലേക്ക് ഫയർബേസ് ഫങ്ഷനുകൾ കണക്ട് ചെയ്യുന്നു
        window.db = database;
        window.pushData = push;
        window.dbRef = ref;
    </script>

    <!-- POS Logic JavaScript -->
    <script>
        let cart = [];

        // ലൈവ് ടൈം കാണിക്കാൻ
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleString('en-US', { hour12: true });
        }, 1000);

        // ഫോം സബ്മിറ്റ് ചെയ്യുമ്പോൾ കാർട്ടിലേക്ക് ഐറ്റം ചേർക്കാൻ
        document.getElementById('item-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('item-name').value;
            const price = parseFloat(document.getElementById('item-price').value);
            const qty = parseInt(document.getElementById('item-qty').value);

            const existingItem = cart.find(item => item.name.toLowerCase() === name.toLowerCase());

            if (existingItem) {
                existingItem.qty += qty;
            } else {
                cart.push({ id: Date.now(), name, price, qty });
            }

            document.getElementById('item-form').reset();
            document.getElementById('item-qty').value = 1;
            updateCartUI();
        });

        // കാർട്ട് ടേബിൾ അപ്ഡേറ്റ് ചെയ്യാൻ
        function updateCartUI() {
            const tbody = document.getElementById('cart-table-body');
            const emptyMsg = document.getElementById('empty-cart-msg');
            tbody.innerHTML = '';

            if (cart.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
            }

            let subtotal = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="p-3 font-medium">${item.name}</td>
                    <td class="p-3 text-center">₹${item.price.toFixed(2)}</td>
                    <td class="p-3 text-center">${item.qty}</td>
                    <td class="p-3 text-right font-semibold">₹${itemTotal.toFixed(2)}</td>
                    <td class="p-3 text-center">
                        <button onclick="removeItem(${item.id})" class="text-red-500 hover:text-red-700 bg-red-50 p-1.5 rounded-lg transition">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const tax = subtotal * 0.18; // 18% GST
            const grandTotal = subtotal + tax;

            document.getElementById('subtotal').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('tax').innerText = `₹${tax.toFixed(2)}`;
            document.getElementById('grand-total').innerText = `₹${grandTotal.toFixed(2)}`;
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function clearCart() {
            cart = [];
            document.getElementById('customer-phone').value = '';
            updateCartUI();
        }

        // Firebase-ലേക്ക് സേവ് ചെയ്യാനും പ്രിന്റ് ചെയ്യാനും ഉള്ള ഫങ്ഷൻ
        function checkoutBill() {
            if (cart.length === 0) {
                alert("കാർട്ട് ശൂന്യമാണ്! ദയവായി ഉൽപ്പന്നങ്ങൾ ചേർക്കുക.");
                return;
            }

            const subtotal = document.getElementById('subtotal').innerText;
            const tax = document.getElementById('tax').innerText;
            const total = document.getElementById('grand-total').innerText;
            const phone = document.getElementById('customer-phone').value || "N/A";

            const billData = {
                billDate: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
                customerPhone: phone,
                items: cart,
                subtotal: subtotal,
                tax: tax,
                grandTotal: total
            };

            // ഫയർബേസിലേക്ക് ഡാറ്റ അപ്‌ലോഡ് ചെയ്യുന്നു
            if (window.db) {
                const billsRef = window.dbRef(window.db, 'bills');
                
                window.pushData(billsRef, billData)
                    .then(() => {
                        alert("ബിൽ Firebase-ലേക്ക് വിജയകരമായി സേവ് ചെയ്തു! 💾");
                        window.print(); // ബിൽ പ്രിന്റ് ഓപ്ഷൻ ഓപ്പൺ ആകും
                        clearCart();
                    })
                    .catch((error) => {
                        console.error("Firebase Error: ", error);
                        alert("ക്ഷമിക്കണം, ഫയർബേസിലേക്ക് കണക്ട് ചെയ്യാൻ പറ്റിയില്ല. റൂൾസ് ഒന്നു ചെക്ക് ചെയ്യുക.");
                    });
            } else {
                window.print();
            }
        }
    </script>
</body>
</html>
